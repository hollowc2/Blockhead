# =============================================================================
# Blockhead (CobbleBob) configuration — single-file layout
# =============================================================================
# Section map (spec §30):
#   server/home/navigation   -> spec 30.2 minecraft.yaml
#   agent/behavior/llm       -> spec 30.1 agent.yaml
#   bootstrap/background     -> maintenance.yaml (bootstrap + stockpile tuning)
#   items                    -> item-policy.yaml (spec 24.5)
#   policy                   -> safety/policy constraints (spec 34)
#   storage/status/tui        -> misc

status:
  enabled: true
  host: 127.0.0.1
  port: 8155

# All keys are Zod-validated against src/config/schema.ts at startup.

# --- 30.1 agent.yaml: identity, behavior, LLM -------------------------------
agent:
  name: CobbleBob
  owner: Barnabyisbig

behavior:
  concise_chat: true       # short task-oriented replies (spec 3)
  auto_sleep: true         # sleep in the home bed at night when idle (spec 9)
  auto_upgrade_tools: true # wood -> stone -> iron when resources allow (spec 10.2)
  allow_pvp: false         # hard combat veto: human players never attacked (spec 25)

llm:
  base_url: http://127.0.0.1:8080
  request_timeout_ms: 30000
  http_retries: 1
  schema_retries: 1

# --- 30.2 minecraft.yaml: server / world / home -----------------------------
server:
  host: eros
  port: 25565
  username: CobbleBob

home:
  dimension: overworld
  x: 0
  y: 64
  z: 0
  protected_size_x: 100
  protected_size_z: 100

# Phase 9 (spec 12): beyond this distance from home, in blocks, the gather
# skills run the expedition supply check (food, tools, inventory space,
# health, return plan) before expanding the search, then operate under the
# distance-aware risk policy. A search that must go farther is refused when
# the checks do not pass, so CobbleBob stays within reach of home.
navigation:
  expedition_threshold: 256

# --- maintenance.yaml: bootstrap tuning -------------------------------------
bootstrap:
  wood_logs: 8
  search_radius: 48
  # Furthest radius gather_food expands to (and patrols to) before giving
  # up. Bigger than the default 256 so far-away animals, villages, and
  # crop fields are reachable; the expedition threshold still gates other
  # gather skills.
  hunt_max_radius: 1024
  cobblestone: 12
  stone_sword: true
  food_items: 8
  wool_blocks: 3
  fuel_items: 4
  torches: 16
  iron_ore: 6

# --- item-policy.yaml (spec 24.5): value overrides ---------------------------
# Consulted by the ItemPolicy before its built-in rules. These drive the
# death-recovery pickup order (spec 26.1) — critical -> valuable -> useful ->
# everything else.
items:
  dirt: expendable
  cobblestone: common
  diamond_pickaxe: critical

# --- policy (spec 34): deterministic safety hard constraints -----------------
policy:
  # Dangerous work (hunting hostiles, defending, exploring) retreats at or
  # below this health floor.
  health_retreat_threshold: 8
  # Dimensions the agent may enter; anything else is refused with
  # DIMENSION_FORBIDDEN. Nether/End need explicit opt-in here.
  allowed_dimensions: [overworld]
  # Standoff radius kept from known lava while choosing work sites.
  lava_avoidance_radius: 4

# --- maintenance.yaml: background stockpiles + idle loop (spec 29, 4.3) -----
# Omitted keys fall back to the schema defaults below.
background:
  stockpiles:
    wood: 64
    food: 64
    fuel: 64
    torches: 64
  # Phase 8 (spec 5.4): below this floor a stockpile is restored at
  # MAINTENANCE priority, preempting even a foreground user task.
  stockpile_minimums:
    wood: 16
    food: 16
    fuel: 16
    torches: 8
  check_interval_seconds: 30
  # A failed stockpile restore backs off this long before the same kind is
  # tried again (a 1s re-run loop on an impossible restore gets the bot
  # kicked for chat spam). A kind whose bot state makes it incapable of
  # succeeding stands by until the state changes, regardless of this window.
  restore_cooldown_seconds: 60
  # Identical game-chat announcements repeat at most once per this window;
  # pino logs are never throttled.
  announce_throttle_seconds: 30
  # Phase 13: the LLM director chooses the next background task whenever the
  # bot is idle; the deterministic shortage-then-storage ladder runs only when
  # the model is disabled or unreachable. `llm_decision_interval_seconds` is
  # the minimum gap between director calls (the model's "wait" is honored for
  # the whole window; survival floors still preempt immediately).
  llm_decisions: true
  llm_decision_interval_seconds: 60

# --- anti-loop watchdog (generic, above every skill) ------------------------
# After `max_failures` failed attempts of the same high-level action (task
# type + normalized arguments — e.g. collect_resource:coal:32), the action
# is temporarily BLOCKED for `cooldown_seconds`: the scheduler holds matching
# tasks and the LLM sees the reason, so CobbleBob stops re-attempting a
# hopeless action. Success or meaningful partial progress resets/reduces the
# count; an explicit owner-issued command always runs and resets the state.
watchdog:
  max_failures: 3
  cooldown_seconds: 600

# --- misc --------------------------------------------------------------------
storage:
  db_path: data/blockhead.db

# Phase 12 (spec 33): development dashboard. Enabled by default on a TTY;
# the TUI owns the terminal while pino keeps writing logs/blockhead.log.
# Set `enabled: false` to return stdout to pino console output.
tui:
  enabled: true
