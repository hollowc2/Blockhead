<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CobbleBob Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <main>
    <header class="topbar"><div><p class="eyebrow">BLOCKHEAD / COBBLEBOB</p><h1>Live dashboard</h1></div><div id="connection" class="status status-offline">Disconnected</div></header>
    <section class="grid">
      <article class="card wide"><h2>Vitals</h2><div class="metrics"><div><span>Health</span><strong id="health">—</strong></div><div><span>Hunger</span><strong id="hunger">—</strong></div><div><span>Position</span><strong id="position">—</strong></div><div><span>Dimension</span><strong id="dimension">—</strong></div><div><span>Time</span><strong id="timePhase">—</strong></div></div></article>
      <article class="card"><h2>Now</h2><dl><dt>Goal</dt><dd id="goal">—</dd><dt>Task</dt><dd id="task">—</dd><dt>Action</dt><dd id="action">—</dd></dl></article>
      <article class="card"><h2>LLM</h2><div id="llmState" class="large-value">Not called</div><dl><dt>Decision</dt><dd id="decision">—</dd><dt>Last rationale</dt><dd id="rationale">—</dd><dt>Last failure</dt><dd id="llmFailure">—</dd></dl></article>
      <article class="card"><h2>Stockpiles</h2><div id="stockpiles" class="rows muted">No stockpile data</div></article>
      <article class="card"><h2>Inventory</h2><div id="inventory" class="rows muted">No inventory data</div></article>
      <article class="card wide"><h2>Recent activity</h2><div class="columns"><div><h3>Events</h3><div id="events" class="feed"></div></div><div><h3>Failures</h3><div id="failures" class="feed"></div></div><div><h3>Chat</h3><div id="chat" class="feed"></div></div></div></article>
    </section>
  </main>
  <script src="/dashboard.js" defer></script>
</body>
</html>
