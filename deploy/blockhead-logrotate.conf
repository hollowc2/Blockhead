# Rotation for the bot's file logs (installed on maia by deploy/install-logrotate.sh).
# The bot opens both files with O_APPEND, so copytruncate is safe while it runs;
# at most the lines written during the copy are lost.
/mnt/Repos/Games/Blockhead/logs/blockhead.log
/mnt/Repos/Games/Blockhead/logs/blockhead-debug.jsonl
/mnt/Repos/Games/Blockhead/logs/blockhead-console.log
{
  daily
  maxsize 100M
  rotate 14
  maxage 30
  missingok
  notifempty
  copytruncate
  compress
  dateext
  dateformat -%Y%m%d-%H%M%S
}
